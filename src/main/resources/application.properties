spring.application.name=FraudDetectionSoftware

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:frauddetection}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

spring.validation.enabled=true

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

logging.level.root=INFO
logging.level.com.example.frauddetectionsoftware=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized

# Fraud detection config
fraud.rules.money-mule.institution-threshold=2
fraud.rules.money-mule.time-window-hours=24
fraud.rules.high-value-transfer.daily-threshold-usd=10000
fraud.rules.high-value-transfer.time-window-hours=24
fraud.rules.structuring-velocity.transaction-count-threshold=10
fraud.rules.structuring-velocity.time-window-hours=24

fraud.entity-resolution.confidence-threshold=80
fraud.entity-resolution.blocking-field=date_of_birth